<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybook</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] } } } };</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { scrollbar-width: none; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
  .pop { animation: pop .18s ease-out; }
  input[type=date]::-webkit-calendar-picker-indicator, input[type=time]::-webkit-calendar-picker-indicator { opacity: .5; }
  .dark input[type=date]::-webkit-calendar-picker-indicator, .dark input[type=time]::-webkit-calendar-picker-indicator { filter: invert(1); }
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">

<div id="auth" class="hidden min-h-screen flex items-center justify-center p-4"></div>
<div id="app" class="hidden"></div>

<div id="modal" class="fixed inset-0 z-40 hidden">
  <div data-action="close-modal" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm"></div>
  <div class="absolute inset-x-0 bottom-0 sm:inset-0 sm:flex sm:items-center sm:justify-center sm:p-4 pointer-events-none">
    <div id="modalBody" class="pop pointer-events-auto w-full sm:max-w-lg max-h-[90vh] overflow-y-auto bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-2xl p-5 sm:p-6 shadow-2xl"></div>
  </div>
</div>
<div id="toasts" class="fixed top-4 right-4 z-50 space-y-2 w-80 max-w-[calc(100vw-2rem)]"></div>

<script>
/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd();
const addDays = (s, n) => { const d = new Date(s + 'T00:00'); d.setDate(d.getDate() + n); return ymd(d); };
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const dayOf = iso => ymd(new Date(iso));
const fmtDate = s => s ? new Date(s + 'T00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) : '';
const fmtTime = t => { if (!t) return ''; const [h, m] = t.split(':').map(Number); return `${(h % 12) || 12}:${pad(m)} ${h < 12 ? 'AM' : 'PM'}`; };
const clock = iso => new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const dayLabel = d => d === today() ? 'Today' : d === addDays(today(), -1) ? 'Yesterday' : d === addDays(today(), 1) ? 'Tomorrow' : fmtDate(d);
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} },
};
const upsert = (arr, o) => { const i = arr.findIndex(x => x._id === o._id); i >= 0 ? arr[i] = o : arr.unshift(o); };
const removeById = (arr, id) => { const i = arr.findIndex(x => x._id === id); if (i >= 0) arr.splice(i, 1); };
const byId = (arr, id) => arr.find(x => x._id === String(id));
const normTag = s => String(s).trim().toLowerCase().replace(/^#/, '').replace(/\s+/g, '_').replace(/[^\w-]/g, '');

/* ================= Design tokens ================= */
const CARD = 'bg-white dark:bg-slate-900 border border-slate-200/70 dark:border-slate-800 rounded-2xl';
const INPUT = 'w-full rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800/60 px-3 py-2 text-sm outline-none transition focus:ring-2 focus:ring-indigo-500/30 focus:border-indigo-500 placeholder:text-slate-400';
const LABEL = 'block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5';
const BTN = 'inline-flex items-center gap-1.5 rounded-xl px-3.5 py-2 text-sm font-medium transition disabled:opacity-50';
const BTN_P = BTN + ' bg-indigo-600 text-white hover:bg-indigo-500 shadow-sm shadow-indigo-600/20';
const BTN_G = BTN + ' text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800';

const I = (d, c = 'w-5 h-5') => `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  bulb: '<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
  bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  award: '<circle cx="12" cy="8" r="6"/><path d="M15.5 13 17 22l-5-3-5 3 1.5-9"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  out: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
  repeat: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  chevL: '<path d="m15 18-6-6 6-6"/>', chevR: '<path d="m9 18 6-6-6-6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  flame: '<path d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-4 5-4 7-1-1-2-2-2-4-2 2-3 5-3 8 0 5 3 8 7 8z"/>',
};
const LOGO = `<div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 grid place-items-center text-white shadow-lg shadow-indigo-500/30">${I(IC.check, 'w-5 h-5')}</div>`;

/* ================= Domain constants ================= */
const PRESET_TAGS = {
  must_do:   { label: 'Must do',        cls: 'bg-rose-100 text-rose-700 dark:bg-rose-500/15 dark:text-rose-300' },
  important: { label: 'Important',      cls: 'bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300' },
  try_new:   { label: 'Try new',        cls: 'bg-violet-100 text-violet-700 dark:bg-violet-500/15 dark:text-violet-300' },
  exploring: { label: 'Just exploring', cls: 'bg-sky-100 text-sky-700 dark:bg-sky-500/15 dark:text-sky-300' },
};
const PRI = Object.keys(PRESET_TAGS);
const tagCls = t => PRESET_TAGS[t]?.cls || 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300';
const tagLabel = t => PRESET_TAGS[t]?.label || '#' + t;
const chip = t => `<span class="inline-block text-[11px] font-medium px-2 py-0.5 rounded-full ${tagCls(t)}">${esc(tagLabel(t))}</span>`;

const VIRTUES = [
  { k: 'temperance', n: 'Temperance', d: 'Eat not to dullness; drink not to elevation.' },
  { k: 'silence', n: 'Silence', d: 'Speak not but what may benefit others or yourself; avoid trifling conversation.' },
  { k: 'order', n: 'Order', d: 'Let all your things have their places; let each part of your business have its time.' },
  { k: 'resolution', n: 'Resolution', d: 'Resolve to perform what you ought; perform without fail what you resolve.' },
  { k: 'frugality', n: 'Frugality', d: 'Make no expense but to do good to others or yourself; waste nothing.' },
  { k: 'industry', n: 'Industry', d: 'Lose no time; be always employed in something useful; cut off all unnecessary actions.' },
  { k: 'sincerity', n: 'Sincerity', d: 'Use no hurtful deceit; think innocently and justly, and if you speak, speak accordingly.' },
  { k: 'justice', n: 'Justice', d: 'Wrong none by doing injuries, or omitting the benefits that are your duty.' },
  { k: 'moderation', n: 'Moderation', d: 'Avoid extremes; forbear resenting injuries so much as you think they deserve.' },
  { k: 'cleanliness', n: 'Cleanliness', d: 'Tolerate no uncleanliness in body, clothes, or habitation.' },
  { k: 'tranquility', n: 'Tranquility', d: 'Be not disturbed at trifles, or at accidents common or unavoidable.' },
  { k: 'chastity', n: 'Chastity', d: 'Guard your health and vitality; never let desire harm yourself or others.' },
  { k: 'humility', n: 'Humility', d: 'Imitate Jesus and Socrates.' },
];

const TEMPLATES = [
  { title: 'Daily journal', message: 'Write about your day', time: '21:00', repeat: 'daily', action: { kind: 'thought', tag: 'daily_general' } },
  { title: 'Virtue review', message: 'What good have I done today?', time: '21:30', repeat: 'daily', action: { kind: 'virtues' } },
  { title: 'Plan tomorrow', message: "Add tomorrow's todos before bed", time: '22:00', repeat: 'daily', action: { kind: 'none' } },
  { title: 'Morning gratitude', message: 'Note one thing you are grateful for', time: '08:00', repeat: 'daily', action: { kind: 'thought', tag: 'gratitude' } },
];

const NAV = [
  { id: 'today', label: 'Today', short: 'Today', icon: 'sun' },
  { id: 'todos', label: 'Todos', short: 'Todos', icon: 'list' },
  { id: 'thoughts', label: 'Thoughts', short: 'Thoughts', icon: 'bulb' },
  { id: 'reminders', label: 'Reminders', short: 'Remind', icon: 'bell' },
  { id: 'virtues', label: '13 Virtues', short: 'Virtues', icon: 'award' },
];

/* ================= State ================= */
const S = {
  token: store.get('db_token'), user: null, authMode: 'login',
  todos: [], thoughts: [], reminders: [], virtues: {},
  view: store.get('db_view') || 'today', todoFilter: 'today', todoTag: null,
  thoughtTag: null, q: '', draft: '', quick: '', vDate: today(), vFrom: today(), day: today(), timer: null,
};
const M = {}; // modal-local state
const TP = {}; // tag pickers

/* ================= API ================= */
async function api(path, method = 'GET', body) {
  const r = await fetch('/api' + path, {
    method,
    headers: { 'Content-Type': 'application/json', ...(S.token ? { Authorization: 'Bearer ' + S.token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (r.status === 401 && S.token && !path.startsWith('/auth')) { logout(); throw new Error('Session expired, please log in again'); }
  const data = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok) throw new Error(data?.error || 'Request failed');
  return data;
}

/* ================= UI primitives ================= */
function toast(msg, { html = false, timeout = 2800, actions = [], type = 'ok' } = {}) {
  const el = document.createElement('div');
  el.className = `${CARD} pop shadow-lg p-3 text-sm flex gap-3 items-start transition-opacity duration-200 ${type === 'err' ? '!border-rose-300 dark:!border-rose-500/40' : ''}`;
  el.innerHTML = `<div class="flex-1 min-w-0">${html ? msg : esc(msg)}${actions.length ? '<div data-acts class="flex gap-2 mt-2.5"></div>' : ''}</div>
    <button class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">${I(IC.x, 'w-4 h-4')}</button>`;
  const close = () => { el.style.opacity = '0'; setTimeout(() => el.remove(), 200); };
  el.lastElementChild.onclick = close;
  const box = el.querySelector('[data-acts]');
  actions.forEach((a, i) => {
    const b = document.createElement('button');
    b.className = `px-2.5 py-1 rounded-lg text-xs font-medium ${i ? 'bg-slate-100 dark:bg-slate-800' : 'bg-indigo-600 text-white'}`;
    b.textContent = a.label;
    b.onclick = () => { close(); Promise.resolve(a.fn()).catch(e => toast(e.message, { type: 'err' })); };
    box.appendChild(b);
  });
  $('#toasts').appendChild(el);
  if (timeout) setTimeout(close, timeout);
}

function openModal(html) {
  $('#modalBody').innerHTML = html;
  $('#modal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  setTimeout(() => $('#modalBody').querySelector('[autofocus], textarea, input:not([type=hidden]):not([type=checkbox])')?.focus(), 40);
}
function closeModal() {
  $('#modal').classList.add('hidden');
  document.body.style.overflow = '';
  $('#modalBody').innerHTML = '';
}
const modalOpen = () => !$('#modal').classList.contains('hidden');
const modalHead = title => `<div class="flex items-center justify-between mb-1"><h3 class="text-lg font-semibold">${title}</h3>
  <button type="button" data-action="close-modal" class="p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">${I(IC.x, 'w-5 h-5')}</button></div>`;

function askConfirm(msg, ok = 'Delete') {
  return new Promise(res => {
    const w = document.createElement('div');
    w.className = 'fixed inset-0 z-[60] grid place-items-center p-4 bg-slate-900/40 backdrop-blur-sm';
    w.innerHTML = `<div class="${CARD} pop p-5 w-full max-w-sm shadow-2xl"><p class="text-sm">${esc(msg)}</p>
      <div class="flex justify-end gap-2 mt-5"><button data-r="0" class="${BTN_G}">Cancel</button>
      <button data-r="1" class="${BTN} bg-rose-600 text-white hover:bg-rose-500">${ok}</button></div></div>`;
    w.onclick = e => { const b = e.target.closest('[data-r]'); if (b || e.target === w) { w.remove(); res(b?.dataset.r === '1'); } };
    document.body.appendChild(w);
  });
}

const empty = (t, s, emoji = '✨') => `<div class="text-center py-12 px-4"><div class="text-3xl mb-2">${emoji}</div><div class="font-medium">${t}</div><div class="text-sm text-slate-500 mt-1">${s}</div></div>`;
const iconBtn = (action, id, icon, extra = '') => `<button type="button" data-action="${action}" data-id="${id}" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-100 dark:hover:text-slate-200 dark:hover:bg-slate-800 ${extra}">${I(icon, 'w-4 h-4')}</button>`;

/* ================= Tag picker ================= */
function initTP(id, sel = [], sug = []) { TP[id] = { sel: new Set(sel), sug: [...new Set([...sel, ...sug])] }; }
function tpChips(id) {
  const p = TP[id];
  const shown = [...p.sel, ...p.sug.filter(t => !p.sel.has(t)).slice(0, 16)];
  if (!shown.length) return '<span class="text-xs text-slate-400">No tags yet — type one below and press Enter</span>';
  return shown.map(t => {
    const on = p.sel.has(t);
    return `<button type="button" data-action="tp-toggle" data-tp="${id}" data-tag="${esc(t)}"
      class="text-xs px-2.5 py-1 rounded-full border transition ${on ? 'border-transparent ring-2 ring-indigo-500/40 ' + tagCls(t) : 'border-slate-200 dark:border-slate-700 text-slate-500 hover:border-slate-400'}">${on ? '✓ ' : ''}${esc(tagLabel(t))}</button>`;
  }).join('');
}
const tpHTML = (id, ph = 'New tag — press Enter') => `<div class="flex flex-wrap gap-1.5" data-tp-chips="${id}">${tpChips(id)}</div>
  <input data-tp-input="${id}" class="${INPUT} mt-2" placeholder="${ph}">`;
function refreshTP(id) { const el = document.querySelector(`[data-tp-chips="${id}"]`); if (el) el.innerHTML = tpChips(id); }
function addTPTags(id, raw) {
  raw.split(',').map(normTag).filter(Boolean).forEach(t => { TP[id].sel.add(t); if (!TP[id].sug.includes(t)) TP[id].sug.unshift(t); });
  refreshTP(id);
}
function tpValue(id) {
  const inp = document.querySelector(`[data-tp-input="${id}"]`);
  if (inp?.value.trim()) { addTPTags(id, inp.value); inp.value = ''; }
  return [...TP[id].sel];
}

/* ================= Todo logic ================= */
const isDoneOn = (t, d) => t.repeat === 'daily' ? (t.completedDates || []).includes(d) : !!t.done;
const rank = t => { const i = PRI.findIndex(p => (t.tags || []).includes(p)); return i < 0 ? 9 : i; };
const sortTodos = (list, d) => [...list].sort((a, b) =>
  (isDoneOn(a, d) - isDoneOn(b, d)) || rank(a) - rank(b) || (a.time || '99').localeCompare(b.time || '99') || new Date(a.createdAt) - new Date(b.createdAt));
function streak(dates = []) {
  const set = new Set(dates); let d = today();
  if (!set.has(d)) d = addDays(d, -1);
  let n = 0; while (set.has(d)) { n++; d = addDays(d, -1); }
  return n;
}
function todayList(d = today()) {
  return S.todos.filter(t => {
    if (t.repeat === 'daily') return true;
    if (t.done) return t.doneAt && dayOf(t.doneAt) === d;
    return !t.dueDate || t.dueDate <= d;
  });
}
function listFor(k, d = today()) {
  switch (k) {
    case 'today': return todayList(d);
    case 'upcoming': return S.todos.filter(t => t.repeat === 'once' && !t.done && t.dueDate > d);
    case 'daily': return S.todos.filter(t => t.repeat === 'daily');
    case 'open': return S.todos.filter(t => t.repeat === 'once' && !t.done);
    case 'done': return S.todos.filter(t => t.repeat === 'once' && t.done);
  }
  return [];
}
const reminderForTodo = id => S.reminders.find(r => r.action?.kind === 'todo' && String(r.action.todoId) === String(id));
const allTodoTags = () => [...new Set(S.todos.flatMap(t => t.tags || []))];

function parseQuick(s) {
  const tags = []; let repeat = 'once';
  const title = s
    .replace(/(^|\s)#([\w-]+)/g, (_, sp, t) => { tags.push(normTag(t)); return sp; })
    .replace(/(^|\s)\/daily\b/i, () => { repeat = 'daily'; return ' '; })
    .replace(/(^|\s)!(?=\s|$)/g, () => { tags.push('must_do'); return ' '; })
    .replace(/\s+/g, ' ').trim();
  return { title, tags: [...new Set(tags)], repeat };
}

function todoRow(t, d = today()) {
  const done = isDoneOn(t, d);
  const overdue = t.repeat === 'once' && !t.done && t.dueDate && t.dueDate < d;
  const rem = reminderForTodo(t._id);
  const cl = t.checklist || [], clDone = cl.filter(c => c.done).length;
  const st = t.repeat === 'daily' ? streak(t.completedDates) : 0;
  const meta = [
    t.repeat === 'daily' ? `<span class="inline-flex items-center gap-1 text-[11px] font-medium text-indigo-600 dark:text-indigo-400">${I(IC.repeat, 'w-3 h-3')}Daily${st ? ` · <span class="text-orange-500">🔥 ${st}</span>` : ''}</span>` : '',
    t.repeat === 'once' && t.dueDate && t.dueDate !== d ? `<span class="text-[11px] ${overdue ? 'text-rose-500 font-medium' : 'text-slate-500'}">${overdue ? 'Overdue · ' : ''}${dayLabel(t.dueDate)}</span>` : '',
    t.time ? `<span class="inline-flex items-center gap-1 text-[11px] text-slate-500">${I(IC.clock, 'w-3 h-3')}${fmtTime(t.time)}</span>` : '',
    rem ? `<span class="inline-flex items-center gap-1 text-[11px] text-slate-500">${I(IC.bell, 'w-3 h-3')}${fmtTime(rem.time)}</span>` : '',
    cl.length ? `<span class="text-[11px] text-slate-500">☑ ${clDone}/${cl.length}</span>` : '',
    ...(t.tags || []).map(chip),
  ].filter(Boolean).join('');
  return `<div class="group flex items-start gap-3 px-3 py-2.5 rounded-xl hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
    <button type="button" data-action="toggle-todo" data-id="${t._id}" aria-label="Toggle"
      class="mt-0.5 shrink-0 w-5 h-5 rounded-full border-2 grid place-items-center transition ${done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-300 dark:border-slate-600 hover:border-emerald-500'}">${done ? I(IC.check, 'w-3 h-3') : ''}</button>
    <div class="flex-1 min-w-0 cursor-pointer" data-action="edit-todo" data-id="${t._id}">
      <div class="text-sm font-medium ${done ? 'line-through text-slate-400' : ''}">${esc(t.title)}</div>
      ${t.notes ? `<div class="text-xs text-slate-500 truncate mt-0.5">${esc(t.notes)}</div>` : ''}
      ${meta ? `<div class="flex flex-wrap items-center gap-x-2.5 gap-y-1 mt-1.5">${meta}</div>` : ''}
    </div>
    ${iconBtn('delete-todo', t._id, IC.trash, 'sm:opacity-0 sm:group-hover:opacity-100')}
  </div>`;
}

/* ================= Thought logic ================= */
function thoughtTagCounts() {
  const m = {};
  S.thoughts.forEach(t => (t.tags || []).forEach(x => m[x] = (m[x] || 0) + 1));
  return Object.entries(m).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
}
const thoughtTagList = () => thoughtTagCounts().map(x => x[0]);
function ensureComposer() {
  const sug = thoughtTagList();
  if (!TP.composer) initTP('composer', S.thoughtTag && S.thoughtTag !== '__none' ? [S.thoughtTag] : [], sug);
  else TP.composer.sug = [...new Set([...TP.composer.sug, ...sug])];
}
function filteredThoughts() {
  const q = S.q.trim().toLowerCase();
  return S.thoughts.filter(t =>
    (S.thoughtTag == null || (S.thoughtTag === '__none' ? !t.tags.length : t.tags.includes(S.thoughtTag))) &&
    (!q || t.text.toLowerCase().includes(q) || t.tags.some(x => x.includes(q))));
}
const thoughtCard = t => `<article class="${CARD} p-4 group">

/* ================= Reminder logic ================= */
const remDueToday = (r, d) => r.active && (r.repeat === 'daily' || r.date === d);
function remDone(r, d = today()) {
  const k = r.action?.kind || 'none';
  if (k === 'thought' && r.action.tag) return S.thoughts.some(t => t.tags.includes(r.action.tag) && dayOf(t.createdAt) === d);
  if (k === 'todo') { const t = byId(S.todos, r.action.todoId); return t ? isDoneOn(t, d) : false; }
  if (k === 'virtues') { const v = S.virtues[d]?.virtues || {}; return VIRTUES.every(x => typeof v[x.k] === 'boolean'); }
  return r.lastFired === d;
}
function remState(r, d = today()) {
  if (!r.active) return 'off';
  if (!remDueToday(r, d)) return r.date && r.date > d ? 'scheduled' : 'past';
  if (remDone(r, d)) return 'done';
  return nowHM() >= r.time ? 'pending' : 'upcoming';
}
function remActionText(r) {
  const k = r.action?.kind;
  if (k === 'thought') return `Write a thought tagged #${r.action.tag}`;
  if (k === 'todo') { const t = byId(S.todos, r.action.todoId); return t ? `Complete: ${t.title}` : 'Complete a todo'; }
  if (k === 'virtues') return 'Review your 13 virtues';
  return '';
}
const actLabel = r => ({ thought: 'Write now', todo: 'Mark done', virtues: 'Review now' }[r.action?.kind] || 'Got it');
function remPill(r) {
  const st = remState(r);
  const map = {
    done: ['Done today', 'bg-emerald-100 text-emerald-700 dark:bg-emerald-500/15 dark:text-emerald-300'],
    pending: ['Pending', 'bg-amber-100 text-amber-700 dark:bg-amber-500/15 dark:text-amber-300'],
    upcoming: [`At ${fmtTime(r.time)}`, 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'],
    scheduled: [fmtDate(r.date), 'bg-sky-100 text-sky-700 dark:bg-sky-500/15 dark:text-sky-300'],
    past: ['Past', 'bg-slate-100 text-slate-500 dark:bg-slate-800'],
    off: ['Paused', 'bg-slate-100 text-slate-500 dark:bg-slate-800'],
  }[st];
  return `<span class="text-[11px] font-medium px-2 py-0.5 rounded-full ${map[1]}">${map[0]}</span>`;
}

async function runReminder(r) {
  const k = r.action?.kind;
  if (k === 'thought') openThought({ tags: [r.action.tag] });
  else if (k === 'virtues') { S.vDate = today(); go('virtues'); }
  else if (k === 'todo') {
    const t = byId(S.todos, r.action.todoId);
    if (t && !isDoneOn(t, today())) { upsert(S.todos, await api(`/todos/${t._id}/toggle`, 'POST', { date: today() })); toast('Marked done ✓'); render(); }
  }
}
function fireReminder(r) {
  const body = r.message || remActionText(r) || 'Reminder';
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      const n = new Notification('⏰ ' + r.title, { body, tag: r._id });
      n.onclick = () => { window.focus(); runReminder(r); n.close(); };
    }
  } catch {}
  const acts = [];
  if ((r.action?.kind || 'none') !== 'none') acts.push({ label: actLabel(r), fn: () => runReminder(r) });
  acts.push({ label: 'Snooze 10 min', fn: () => setTimeout(() => fireReminder(r), 600000) });
  toast(`<div class="flex items-center gap-2 font-semibold">${I(IC.bell, 'w-4 h-4 text-indigo-500')}${esc(r.title)}</div><div class="text-xs text-slate-500 mt-0.5">${esc(body)}</div>`,
    { html: true, timeout: 0, actions: acts });
}
function checkReminders() {
  const d = today(), hm = nowHM();
  S.reminders.forEach(r => {
    if (!remDueToday(r, d) || r.lastFired === d || hm < r.time) return;
    r.lastFired = d;
    api('/reminders/' + r._id, 'PATCH', { lastFired: d }).catch(() => {});
    if ((r.action?.kind || 'none') !== 'none' && remDone(r, d)) return; // already handled today
    fireReminder(r);
  });
}
function askNotify() {
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().then(() => render());
}

/* ================= Virtue logic ================= */
const vEntry = d => S.virtues[d] ??= { date: d, virtues: {}, morning: '', evening: '' };
const vTimers = {};
function saveVirtue(d) {
  clearTimeout(vTimers[d]);
  vTimers[d] = setTimeout(() => {
    const v = S.virtues[d];
    api('/virtues/' + d, 'PUT', { virtues: v.virtues, morning: v.morning || '', evening: v.evening || '' }).catch(e => toast(e.message, { type: 'err' }));
  }, 500);
}
function focusVirtue(d = today()) {
  const days = Math.round((new Date(d + 'T00:00') - new Date('2024-01-01T00:00')) / 864e5);
  return VIRTUES[((Math.floor(days / 7) % 13) + 13) % 13];
}
async function ensureVirtues(d) {
  const from = addDays(d, -6);
  if (from >= S.vFrom) return;
  const rows = await api(`/virtues?from=${from}&to=${addDays(S.vFrom, -1)}`);
  rows.forEach(r => S.virtues[r.date] = r);
  S.vFrom = from;
}

        <button type="button" data-action="virtue" data-k="${v.k}" data-v="1" title="Followed" class="w-9 h-9 rounded-xl grid place-items-center border transition ${val === true ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-400 hover:border-emerald-400 hover:text-emerald-500'}">${I(IC.check, 'w-4 h-4')}</button>
        <button type="button" data-action="virtue" data-k="${v.k}" data-v="0" title="Slipped" class="w-9 h-9 rounded-xl grid place-items-center border transition ${val === false ? 'bg-rose-500 border-rose-500 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-400 hover:border-rose-400 hover:text-rose-500'}">${I(IC.x, 'w-4 h-4')}</button>
      </div></div>`;
  };
  const cell = (x, k) => { const v = S.virtues[x]?.virtues?.[k]; return `<td class="p-1 text-center"><span class="inline-block w-3 h-3 rounded-full ${v === true ? 'bg-emerald-500' : v === false ? 'bg-rose-500' : 'bg-slate-200 dark:bg-slate-700'}"></span></td>`; };

    <div class="flex items-center gap-2">
      <div class="flex items-center ${CARD} p-1">

        <div class="px-3 text-sm font-medium min-w-[130px] text-center">${dayLabel(d)}</div>
        <button type="button" data-action="vdate" data-n="1" ${d >= today() ? 'disabled' : ''} class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-30 disabled:hover:bg-transparent">${I(IC.chevR, 'w-4 h-4')}</button>
      </div>
      ${d !== today() ? `<button type="button" data-action="vdate" data-n="0" class="${BTN_G}">Today</button>` : ''}
    </div>
    <div class="text-sm"><span class="font-semibold text-emerald-600">${kept} kept</span> <span class="text-slate-300 mx-1">·</span>
      <span class="font-semibold text-rose-500">${missed} slipped</span> <span class="text-slate-300 mx-1">·</span><span class="text-slate-500">${13 - kept - missed} unmarked</span></div>
  </div>
  <div class="rounded-2xl p-5 mb-6 bg-gradient-to-br from-amber-50 to-orange-50 dark:from-amber-500/10 dark:to-orange-500/5 border border-amber-200/60 dark:border-amber-500/20">
    <div class="text-[11px] font-semibold uppercase tracking-wider text-amber-700 dark:text-amber-300">This week's focus</div>
    <div class="text-xl font-semibold mt-1">${f.n}</div>
    <p class="text-sm text-slate-600 dark:text-slate-300 mt-1">${f.d}</p>
    <p class="text-xs text-slate-500 mt-2">Franklin gave one virtue strict attention each week and cycled through all 13 every quarter, while still marking the rest daily.</p>
  </div>
  <div class="grid lg:grid-cols-3 gap-6">
    <section class="lg:col-span-2 ${CARD} divide-y divide-slate-100 dark:divide-slate-800 overflow-hidden self-start">${VIRTUES.map(row).join('')}</section>
    <div class="space-y-6">
      <section class="${CARD} p-5 space-y-4">
        <div><label class="${LABEL}">🌅 Morning — What good shall I do this day?</label>
          <textarea data-virtue-text="morning" rows="3" class="${INPUT} resize-y">${esc(e.morning || '')}</textarea></div>
        <div><label class="${LABEL}">🌙 Evening — What good have I done today?</label>
          <textarea data-virtue-text="evening" rows="3" class="${INPUT} resize-y">${esc(e.evening || '')}</textarea></div>
        <p class="text-[11px] text-slate-400">Saves automatically</p>
      </section>
      <section class="${CARD} p-5 overflow-x-auto">
        <h3 class="text-sm font-semibold mb-3">Last 7 days</h3>
        <table class="w-full text-xs"><thead><tr><th></th>${days.map(x => `<th class="font-medium text-slate-400 pb-1 ${x === d ? 'text-indigo-600' : ''}">${new Date(x + 'T00:00').toLocaleDateString(undefined, { weekday: 'narrow' })}</th>`).join('')}</tr></thead>
        <tbody>${VIRTUES.map(v => `<tr><td class="pr-2 py-0.5 text-slate-500 whitespace-nowrap">${v.n}</td>${days.map(x => cell(x, v.k)).join('')}</tr>`).join('')}</tbody></table>
      </section>
    </div>
  </div>`;
};

/* ================= Modals ================= */
function openTodo(t = {}) {
  const rem = t._id ? reminderForTodo(t._id) : null;
  initTP('todo', t.tags || [], [...PRI, ...allTodoTags()]);
  M.todo = { repeat: t.repeat || 'once', checklist: (t.checklist || []).map(c => ({ text: c.text, done: !!c.done })) };
  openModal(`<form data-form="todo" data-id="${t._id || ''}" class="space-y-4">
    ${modalHead(t._id ? 'Edit todo' : 'New todo')}
    <input name="title" required autofocus value="${esc(t.title || '')}" class="${INPUT} !text-base !py-2.5" placeholder="What needs doing?">
    <textarea name="notes" rows="2" class="${INPUT} resize-y" placeholder="Notes (optional)">${esc(t.notes || '')}</textarea>
    <div><label class="${LABEL}">Type</label>
      <div class="flex p-1 rounded-xl bg-slate-100 dark:bg-slate-800">
        <button type="button" data-action="todo-repeat" data-v="once" data-seg>One time</button>
        <button type="button" data-action="todo-repeat" data-v="daily" data-seg>${I(IC.repeat, 'w-3.5 h-3.5 inline -mt-0.5 mr-1')}Daily</button></div>
      <p id="repeatHint" class="text-[11px] text-slate-400 mt-1.5"></p></div>
    <div class="grid grid-cols-2 gap-3">
      <div id="dueWrap"><label class="${LABEL}">Date</label><input type="date" name="dueDate" value="${t.dueDate || today()}" class="${INPUT}"></div>
      <div><label class="${LABEL}">Time (optional)</label><input type="time" name="time" value="${t.time || ''}" class="${INPUT}"></div>
    </div>
    <div><label class="${LABEL}">Tags</label>${tpHTML('todo')}</div>
    <div><label class="${LABEL}">Checklist</label><div id="clList"></div>
      <input id="clInput" class="${INPUT} mt-1" placeholder="Add a step — press Enter"></div>
    <div class="rounded-xl bg-slate-50 dark:bg-slate-800/50 p-3 flex items-center justify-between gap-3">
      <label class="flex items-center gap-2 text-sm font-medium cursor-pointer"><input type="checkbox" name="remind" ${rem ? 'checked' : ''} class="w-4 h-4 accent-indigo-600">${I(IC.bell, 'w-4 h-4 text-slate-400')}Remind me</label>
      <input type="time" name="remindAt" value="${rem?.time || t.time || '09:00'}" class="${INPUT} !w-32">
    </div>
    <div class="flex items-center justify-between pt-2">
      ${t._id ? `<button type="button" data-action="delete-todo" data-id="${t._id}" class="${BTN_G} hover:!text-rose-600">${I(IC.trash, 'w-4 h-4')}Delete</button>` : '<span></span>'}
      <div class="flex gap-2"><button type="button" data-action="close-modal" class="${BTN_G}">Cancel</button><button type="submit" class="${BTN_P}">${t._id ? 'Save' : 'Add todo'}</button></div>
    </div></form>`);
  syncTodoSeg(); renderCL();
}
function syncTodoSeg() {
  document.querySelectorAll('[data-seg]').forEach(b => {
    const on = b.dataset.v === M.todo.repeat;
    b.className = `flex-1 py-2 rounded-lg text-sm font-medium transition ${on ? 'bg-white dark:bg-slate-700 shadow-sm text-slate-900 dark:text-white' : 'text-slate-500'}`;
  });
  $('#dueWrap')?.classList.toggle('invisible', M.todo.repeat === 'daily');
  const h = $('#repeatHint');
  if (h) h.textContent = M.todo.repeat === 'daily' ? 'Shows up every day. Tick it off daily to build a streak 🔥' : 'Shows on its date (and stays as overdue) until done.';
}
function renderCL() {
  const el = $('#clList'); if (!el) return;
  el.innerHTML = M.todo.checklist.map((c, i) => `<div class="flex items-center gap-2 py-1">
    <button type="button" data-action="cl-toggle" data-i="${i}" class="w-4 h-4 rounded border grid place-items-center ${c.done ? 'bg-indigo-600 border-indigo-600 text-white' : 'border-slate-300 dark:border-slate-600'}">${c.done ? I(IC.check, 'w-3 h-3') : ''}</button>
    <span class="flex-1 text-sm ${c.done ? 'line-through text-slate-400' : ''}">${esc(c.text)}</span>
    <button type="button" data-action="cl-del" data-i="${i}" class="text-slate-400 hover:text-rose-500">${I(IC.x, 'w-3.5 h-3.5')}</button></div>`).join('');
}

function openThought(t = {}) {
  initTP('thoughtM', t.tags || [], thoughtTagList());
  openModal(`<form data-form="thought" data-tp="thoughtM" data-id="${t._id || ''}" class="space-y-4">
    ${modalHead(t._id ? 'Edit thought' : 'New thought')}
    <textarea name="text" rows="6" class="${INPUT} resize-y" placeholder="What's on your mind?">${esc(t.text || '')}</textarea>
    <div><label class="${LABEL}">Tags — pick existing or add new</label>${tpHTML('thoughtM')}</div>
    <div class="flex justify-between items-center pt-2"><span class="text-[11px] text-slate-400">Ctrl/⌘ + Enter to save</span>
      <div class="flex gap-2"><button type="button" data-action="close-modal" class="${BTN_G}">Cancel</button><button type="submit" class="${BTN_P}">Save</button></div></div>
  </form>`);
}

function openReminder(r = {}) {
  const k = r.action?.kind || 'none';
  const tags = [...new Set(['daily_general', ...thoughtTagList()])];
  const todos = S.todos.filter(t => t.repeat === 'daily' || !t.done);
  const opt = (v, l, cur) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`;
  openModal(`<form data-form="reminder" data-id="${r._id || ''}" class="space-y-4">
    ${modalHead(r._id ? 'Edit reminder' : 'New reminder')}
    <input name="title" required autofocus value="${esc(r.title || '')}" class="${INPUT} !text-base !py-2.5" placeholder="e.g. Write daily journal">
    <input name="message" value="${esc(r.message || '')}" class="${INPUT}" placeholder="Note shown with the reminder (optional)">
    <div class="grid grid-cols-2 gap-3">
      <div><label class="${LABEL}">Time</label><input type="time" name="time" required value="${r.time || '21:00'}" class="${INPUT}"></div>
      <div><label class="${LABEL}">Repeat</label><select name="repeat" class="${INPUT}">${opt('daily', 'Every day', r.repeat || 'daily')}${opt('once', 'One time', r.repeat || 'daily')}</select></div>
    </div>
    <div data-wrap="date"><label class="${LABEL}">Date</label><input type="date" name="date" value="${r.date || today()}" class="${INPUT}"></div>
    <div><label class="${LABEL}">When it fires, help me…</label>
      <select name="kind" class="${INPUT}">${opt('none', 'Just remind me', k)}${opt('thought', 'Write a thought with a tag', k)}${opt('todo', 'Complete a todo', k)}${opt('virtues', 'Review my 13 virtues', k)}</select></div>
    <div data-wrap="tag"><label class="${LABEL}">Thought tag — the reminder counts as done once you write a thought with it</label>
      <input name="tag" list="tagList" value="${esc(r.action?.tag || 'daily_general')}" class="${INPUT}" placeholder="daily_general">
      <datalist id="tagList">${tags.map(t => `<option value="${esc(t)}">`).join('')}</datalist></div>
    <div data-wrap="todo"><label class="${LABEL}">Todo</label>
      <select name="todoId" class="${INPUT}">${todos.map(t => opt(t._id, t.title + (t.repeat === 'daily' ? ' (daily)' : ''), String(r.action?.todoId || ''))).join('') || '<option value="">No open todos</option>'}</select></div>
    <div class="flex justify-end gap-2 pt-2"><button type="button" data-action="close-modal" class="${BTN_G}">Cancel</button><button type="submit" class="${BTN_P}">${r._id ? 'Save' : 'Create reminder'}</button></div>
  </form>`);
  syncReminderForm($('[data-form=reminder]'));
}
function syncReminderForm(f) {
  const e = f.elements;
  f.querySelector('[data-wrap=date]').classList.toggle('hidden', e.repeat.value !== 'once');
  f.querySelector('[data-wrap=tag]').classList.toggle('hidden', e.kind.value !== 'thought');
  f.querySelector('[data-wrap=todo]').classList.toggle('hidden', e.kind.value !== 'todo');
}

/* ================= Forms ================= */
const FORMS = {
  async auth(f) {
    const e = f.elements, reg = S.authMode === 'register';
    const body = { email: e.email.value, password: e.password.value, ...(reg ? { name: e.name.value } : {}) };
    const r = await api('/auth/' + (reg ? 'register' : 'login'), 'POST', body);
    S.token = r.token; store.set('db_token', r.token); S.user = r.user;
    await enterApp();
  },
  async quick(f) {
    const { title, tags, repeat } = parseQuick(f.elements.q.value);
    if (!title) return;
    const t = await api('/todos', 'POST', { title, tags, repeat, dueDate: repeat === 'once' ? today() : '' });
    upsert(S.todos, t); S.quick = ''; render();
    $('#quickInput')?.focus();
    toast(repeat === 'daily' ? 'Daily todo added' : 'Todo added');
  },
  async todo(f) {
    const e = f.elements, id = f.dataset.id;
    const body = {
      title: e.title.value.trim(), notes: e.notes.value.trim(), repeat: M.todo.repeat,
      dueDate: M.todo.repeat === 'once' ? e.dueDate.value : '', time: e.time.value || '',
      tags: tpValue('todo'), checklist: M.todo.checklist,
    };
    if (!body.title) return;
    const saved = id ? await api('/todos/' + id, 'PATCH', body) : await api('/todos', 'POST', body);
    upsert(S.todos, saved);
    // sync linked reminder
    const rem = reminderForTodo(saved._id), want = e.remind.checked, time = e.remindAt.value;
    if (want && time) {
      const rb = { title: saved.title, time, repeat: saved.repeat, date: saved.repeat === 'once' ? saved.dueDate : '', active: true, action: { kind: 'todo', todoId: saved._id } };
      if (rem) { if (rem.time !== time || rem.date !== rb.date) rb.lastFired = ''; upsert(S.reminders, await api('/reminders/' + rem._id, 'PATCH', rb)); }
      else upsert(S.reminders, await api('/reminders', 'POST', rb));
      askNotify();
    } else if (rem) { await api('/reminders/' + rem._id, 'DELETE'); removeById(S.reminders, rem._id); }
    closeModal(); render(); toast(id ? 'Todo updated' : 'Todo added');
  },
  async thought(f) {
    const id = f.dataset.id, tp = f.dataset.tp, text = f.elements.text.value.trim();
    if (!text) return toast('Write something first', { type: 'err' });
    const body = { text, tags: tpValue(tp) };
    const saved = id ? await api('/thoughts/' + id, 'PATCH', body) : await api('/thoughts', 'POST', body);
    upsert(S.thoughts, saved);
    if (tp === 'composer') { S.draft = ''; initTP('composer', S.thoughtTag && S.thoughtTag !== '__none' ? [S.thoughtTag] : [], thoughtTagList()); }
    else closeModal();
    render(); toast(id ? 'Thought updated' : 'Thought saved');
  },
  async reminder(f) {
    const e = f.elements, id = f.dataset.id, kind = e.kind.value;
    const body = {
      title: e.title.value.trim(), message: e.message.value.trim(), time: e.time.value, repeat: e.repeat.value,
      date: e.repeat.value === 'once' ? e.date.value : '', active: true,
      action: { kind, tag: kind === 'thought' ? normTag(e.tag.value) : '', todoId: kind === 'todo' ? (e.todoId.value || null) : null },
    };
    if (kind === 'thought' && !body.action.tag) return toast('Pick a tag for the thought', { type: 'err' });
    if (kind === 'todo' && !body.action.todoId) return toast('Pick a todo', { type: 'err' });
    if (id) { const old = byId(S.reminders, id); if (old.time !== body.time || old.date !== body.date) body.lastFired = ''; }
    const saved = id ? await api('/reminders/' + id, 'PATCH', body) : await api('/reminders', 'POST', body);
    upsert(S.reminders, saved);
    closeModal(); render(); askNotify(); toast(id ? 'Reminder updated' : 'Reminder created');
  },
};

/* ================= Actions ================= */
const ACTIONS = {
  go: el => go(el.dataset.view),
  'auth-mode': () => { S.authMode = S.authMode === 'register' ? 'login' : 'register'; renderAuth(); },
  theme: toggleTheme,
  logout: () => logout(),
  export: exportData,
  'close-modal': closeModal,

  'new-todo': () => openTodo(),
  'edit-todo': el => openTodo(byId(S.todos, el.dataset.id)),
  async 'toggle-todo'(el) {
    const d = today(), t = await api(`/todos/${el.dataset.id}/toggle`, 'POST', { date: d });
    upsert(S.todos, t); render();
    if (t.repeat === 'daily' && isDoneOn(t, d)) { const s = streak(t.completedDates); if (s > 1) toast(`🔥 ${s}-day streak on “${t.title}”`); }
  },
  async 'delete-todo'(el) {
    if (!await askConfirm('Delete this todo? Linked reminders are removed too.')) return;
    const id = el.dataset.id;
    await api('/todos/' + id, 'DELETE');
    removeById(S.todos, id);
    S.reminders = S.reminders.filter(r => String(r.action?.todoId) !== id);
    closeModal(); render(); toast('Todo deleted');
  },
  'todo-repeat': el => { M.todo.repeat = el.dataset.v; syncTodoSeg(); },
  'cl-toggle': el => { const c = M.todo.checklist[+el.dataset.i]; c.done = !c.done; renderCL(); },
  'cl-del': el => { M.todo.checklist.splice(+el.dataset.i, 1); renderCL(); },
  'todo-filter': el => { S.todoFilter = el.dataset.f; render(); },
  'todo-tag': el => { const t = el.dataset.tag; S.todoTag = t && S.todoTag !== t ? t : null; render(); },
  'tp-toggle': el => { const p = TP[el.dataset.tp], t = el.dataset.tag; p.sel.has(t) ? p.sel.delete(t) : p.sel.add(t); refreshTP(el.dataset.tp); },

  'new-thought': () => openThought(S.thoughtTag && S.thoughtTag !== '__none' ? { tags: [S.thoughtTag] } : {}),
  'edit-thought': el => openThought(byId(S.thoughts, el.dataset.id)),
  async 'delete-thought'(el) {
    if (!await askConfirm('Delete this thought?')) return;
    await api('/thoughts/' + el.dataset.id, 'DELETE'); removeById(S.thoughts, el.dataset.id); render(); toast('Thought deleted');
  },
  'thought-group': el => {
    S.thoughtTag = el.dataset.tag || null;
    initTP('composer', S.thoughtTag && S.thoughtTag !== '__none' ? [S.thoughtTag] : [], thoughtTagList());
    render();
  },
  'thought-tag': el => { S.thoughtTag = el.dataset.tag; S.q = ''; initTP('composer', [S.thoughtTag], thoughtTagList()); go('thoughts'); },

  'new-reminder': () => openReminder(),
  'edit-reminder': el => openReminder(byId(S.reminders, el.dataset.id)),
  async 'delete-reminder'(el) {
    if (!await askConfirm('Delete this reminder?')) return;
    await api('/reminders/' + el.dataset.id, 'DELETE'); removeById(S.reminders, el.dataset.id); render(); toast('Reminder deleted');
  },
  async 'toggle-reminder'(el) {
    const r = byId(S.reminders, el.dataset.id);
    upsert(S.reminders, await api('/reminders/' + r._id, 'PATCH', { active: !r.active })); render();
  },
  'run-reminder': el => runReminder(byId(S.reminders, el.dataset.id)),
  async 'use-template'(el) {
    const t = TEMPLATES[+el.dataset.i];
    if (S.reminders.some(r => r.title === t.title)) return toast('You already have this reminder');
    upsert(S.reminders, await api('/reminders', 'POST', { ...t, active: true })); render(); askNotify();
    toast(`“${t.title}” added for ${fmtTime(t.time)}`);
  },
  'enable-notify': () => askNotify(),

  virtue(el) {
    const e = vEntry(S.vDate), k = el.dataset.k, want = el.dataset.v === '1';
    if (e.virtues[k] === want) delete e.virtues[k]; else e.virtues[k] = want;
    saveVirtue(S.vDate); render();
  },
  async vdate(el) {
    const n = +el.dataset.n;
    S.vDate = n === 0 ? today() : addDays(S.vDate, n);
    if (S.vDate > today()) S.vDate = today();
    await ensureVirtues(S.vDate);
    S.view !== 'virtues' ? go('virtues') : render();
  },
};

/* ================= Shell / render ================= */
function navHTML(mobile) {

    : id === 'reminders' ? S.reminders.filter(r => remState(r) === 'pending').length : 0;
  return NAV.map((n, i) => {
    const a = S.view === n.id, b = badge(n.id);
    if (mobile) return `<button type="button" data-action="go" data-view="${n.id}" class="flex flex-col items-center gap-0.5 py-2 text-[11px] font-medium ${a ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-500'}">
      <span class="relative">${I(IC[n.icon])}${b ? `<span class="absolute -top-1 -right-2.5 min-w-[16px] h-4 px-1 rounded-full bg-rose-500 text-white text-[10px] leading-4 text-center">${b}</span>` : ''}</span>${n.short}</button>`;
    return `<button type="button" data-action="go" data-view="${n.id}" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition ${a ? 'bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-300' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'}">
      ${I(IC[n.icon])}<span class="flex-1 text-left">${n.label}</span>
      ${b ? `<span class="text-[11px] px-1.5 rounded-md ${n.id === 'reminders' ? 'bg-amber-100 text-amber-700 dark:bg-amber-500/20 dark:text-amber-300' : 'bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300'}">${b}</span>` : ''}
      <kbd class="hidden xl:inline text-[10px] text-slate-400 font-sans">${i + 1}</kbd></button>`;
  }).join('');
}

  return `

    <div class="mt-6 px-3 text-[11px] text-slate-400 leading-relaxed">Shortcuts: <b>N</b> new todo · <b>T</b> new thought · <b>1–5</b> switch views</div>
    <div class="mt-auto border-t border-slate-100 dark:border-slate-800 pt-4">
      <div class="flex items-center gap-3 px-2">
        <div class="w-9 h-9 rounded-full bg-slate-200 dark:bg-slate-700 grid place-items-center text-sm font-semibold">${esc((S.user.name || '?')[0].toUpperCase())}</div>
        <div class="min-w-0 flex-1"><div class="text-sm font-medium truncate">${esc(S.user.name)}</div><div class="text-xs text-slate-500 truncate">${esc(S.user.email)}</div></div>
      </div>
      <div class="flex gap-1 mt-3">
        <button type="button" data-action="theme" class="${BTN_G} flex-1 justify-center !px-2" title="Toggle theme">${I(IC.moon, 'w-4 h-4')}</button>
        <button type="button" data-action="export" class="${BTN_G} flex-1 justify-center !px-2" title="Export backup (JSON)">${I(IC.download, 'w-4 h-4')}</button>
        <button type="button" data-action="logout" class="${BTN_G} flex-1 justify-center !px-2" title="Log out">${I(IC.out, 'w-4 h-4')}</button>
      </div>
    </div>
  </aside>
  <div class="lg:pl-64">
    <header class="sticky top-0 z-20 backdrop-blur-md bg-slate-50/80 dark:bg-slate-950/80 border-b border-slate-200/60 dark:border-slate-800/60">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
        <div class="min-w-0"><h1 id="viewTitle" class="text-lg font-semibold tracking-tight"></h1><p id="viewSub" class="text-xs text-slate-500 truncate"></p></div>
        <div class="flex items-center gap-1.5">
          <button type="button" data-action="new-thought" class="${BTN_G}" title="New thought (T)">${I(IC.bulb, 'w-4 h-4')}<span class="hidden sm:inline">Thought</span></button>
          <button type="button" data-action="new-todo" class="${BTN_P}" title="New todo (N)">${I(IC.plus, 'w-4 h-4')}<span class="hidden sm:inline">Todo</span></button>
          <button type="button" data-action="theme" class="lg:hidden p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">${I(IC.moon, 'w-4 h-4')}</button>
          <button type="button" data-action="logout" class="lg:hidden p-2 rounded-xl text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800">${I(IC.out, 'w-4 h-4')}</button>
        </div>
      </div>
    </header>
    <main id="main" class="max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-28 lg:pb-10"></main>
  </div>
  <nav id="bottomNav" class="lg:hidden fixed bottom-0 inset-x-0 z-30 grid grid-cols-5 bg-white/95 dark:bg-slate-900/95 backdrop-blur border-t border-slate-200 dark:border-slate-800 pb-[env(safe-area-inset-bottom)]"></nav>`;
}
function render() {
  if (!S.user) return;
  const v = NAV.find(n => n.id === S.view) || NAV[0];
  S.view = v.id;
  const hr = new Date().getHours();
  const greet = `${hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening'}, ${S.user.name.split(' ')[0]}`;
  const dateStr = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  $('#viewTitle').textContent = v.id === 'today' ? greet : v.label;
  $('#viewSub').textContent = dateStr;
  $('#nav').innerHTML = navHTML(false);
  $('#bottomNav').innerHTML = navHTML(true);
  if (v.id === 'today' || v.id === 'thoughts') ensureComposer();
  $('#main').innerHTML = VIEWS[v.id]();
}
function go(view) { S.view = view; store.set('db_view', view); render(); window.scrollTo({ top: 0 }); }

function renderAuth() {
  const reg = S.authMode === 'register';
  $('#auth').innerHTML = `<div class="w-full max-w-sm">
    <div class="flex items-center gap-2.5 justify-center mb-8">${LOGO}<span class="text-xl font-semibold tracking-tight">Daybook</span></div>
    <div class="${CARD} p-6 shadow-sm">
      <h1 class="text-lg font-semibold">${reg ? 'Create your account' : 'Welcome back'}</h1>
      <p class="text-sm text-slate-500 mt-1 mb-5">${reg ? 'Todos, thoughts, reminders and the 13 virtues — in one place.' : 'Log in to continue your day.'}</p>
      <form data-form="auth" class="space-y-3">
        ${reg ? `<input name="name" required placeholder="Your name" class="${INPUT}" autocomplete="name">` : ''}
        <input name="email" type="email" required placeholder="Email" class="${INPUT}" autocomplete="email">
        <input name="password" type="password" required minlength="6" placeholder="Password (min 6 chars)" class="${INPUT}" autocomplete="${reg ? 'new-password' : 'current-password'}">
        <button type="submit" class="${BTN_P} w-full justify-center !py-2.5">${reg ? 'Create account' : 'Log in'}</button>
      </form>
    </div>
    <p class="text-center text-sm text-slate-500 mt-4">${reg ? 'Already have an account?' : 'New here?'}
      <button type="button" data-action="auth-mode" class="font-medium text-indigo-600 dark:text-indigo-400">${reg ? 'Log in' : 'Create an account'}</button></p>
  </div>`;
  setTimeout(() => $('#auth input')?.focus(), 30);
}
function showAuth() { $('#app').classList.add('hidden'); $('#auth').classList.remove('hidden'); renderAuth(); }

async function loadAll() {
  S.vFrom = addDays(today(), -27); S.vDate = today(); S.day = today();
  const [todos, thoughts, reminders, virtues] = await Promise.all([
    api('/todos'), api('/thoughts'), api('/reminders'), api(`/virtues?from=${S.vFrom}&to=${today()}`),
  ]);
  Object.assign(S, { todos, thoughts, reminders, virtues: Object.fromEntries(virtues.map(v => [v.date, v])) });
}
async function enterApp() {
  $('#auth').classList.add('hidden');
  $('#app').innerHTML = shellHTML();
  $('#app').classList.remove('hidden');
  await loadAll();
  render();
  checkReminders();
  clearInterval(S.timer);
  S.timer = setInterval(tick, 20000);
}
function tick() {
  if (!S.user) return;
  const dayChanged = S.day !== today();
  if (dayChanged) { S.day = today(); S.vDate = today(); }
  checkReminders();
  const typing = document.activeElement?.matches('input, textarea, select');
  if (dayChanged || (!modalOpen() && !typing && ['today', 'reminders'].includes(S.view))) render();
}
function logout() {
  store.set('db_token', null); clearInterval(S.timer);
  Object.assign(S, { token: null, user: null, todos: [], thoughts: [], reminders: [], virtues: {}, draft: '', quick: '' });
  for (const k in TP) delete TP[k];
  closeModal(); S.authMode = 'login'; showAuth();
}
function exportData() {
  const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), todos: S.todos, thoughts: S.thoughts, reminders: S.reminders, virtues: Object.values(S.virtues) }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `daybook-backup-${today()}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function applyTheme() {
  const t = store.get('db_theme');
  const dark = t ? t === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', dark);
}
function toggleTheme() {
  const dark = !document.documentElement.classList.contains('dark');
  store.set('db_theme', dark ? 'dark' : 'light'); applyTheme();
}

/* ================= Global events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  e.preventDefault();
  Promise.resolve(fn(el, e)).catch(err => toast(err.message, { type: 'err' }));
});
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const btn = f.querySelector('[type=submit]');
  if (btn) btn.disabled = true;
  try { await FORMS[f.dataset.form](f); }
  catch (err) { toast(err.message, { type: 'err' }); }
  finally { if (btn) btn.disabled = false; }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.matches('[data-tp-input]')) { e.preventDefault(); addTPTags(t.dataset.tpInput, t.value); t.value = ''; return; }
  if (e.key === 'Enter' && t.id === 'clInput') { e.preventDefault(); const v = t.value.trim(); if (v) { M.todo.checklist.push({ text: v, done: false }); t.value = ''; renderCL(); } return; }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && t.tagName === 'TEXTAREA' && t.form) { e.preventDefault(); t.form.requestSubmit(); return; }
  if (e.key === 'Escape') { if (modalOpen()) closeModal(); return; }
  if (!S.user || modalOpen() || ['INPUT', 'TEXTAREA', 'SELECT'].includes(t.tagName) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'n') { e.preventDefault(); openTodo(); }
  else if (e.key === 't') { e.preventDefault(); ACTIONS['new-thought'](); }
  else if (/^[1-5]$/.test(e.key)) go(NAV[+e.key - 1].id);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.matches('[data-tp-input]') && t.value.includes(',')) { addTPTags(t.dataset.tpInput, t.value); t.value = ''; }
  if (t.id === 'composerText') S.draft = t.value;
  if (t.id === 'quickInput') S.quick = t.value;
  if (t.id === 'thoughtSearch') { S.q = t.value; $('#thoughtList').innerHTML = thoughtListHTML(); }
  if (t.dataset.virtueText) { vEntry(S.vDate)[t.dataset.virtueText] = t.value; saveVirtue(S.vDate); }
});
document.addEventListener('change', e => {
  const f = e.target.form;
  if (f?.dataset.form === 'reminder' && ['kind', 'repeat'].includes(e.target.name)) syncReminderForm(f);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

/* ================= Boot ================= */
(async function boot() {
  applyTheme();
  if (!S.token) return showAuth();
  try { S.user = await api('/me'); await enterApp(); }
  catch { logout(); }
})();
</script>
</body>
</html>
